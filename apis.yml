name: Precium
description: >-
  Precium is a South African fintech that provides local payment infrastructure
  for global merchants expanding into Africa. Its enterprise-grade platform
  handles payment processing across cards, instant EFT, mobile wallets and debit
  orders, plus intelligent smart routing, network tokenization, automated
  reconciliation, cross-border settlement, and payment recovery through retries
  and mandates. Precium exposes a public API and a mandates API (per its status
  dashboard) and integrates via server-to-server, redirect, and orchestrator
  paths with webhook status updates, though it does not publish a public API
  reference or OpenAPI. Backed by Partech, QED Investors, and Speedinvest.
